<svg width="1240" height="820" viewBox="0 0 1240 820" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3a63"/>
      <stop offset="100%" stop-color="#123f6c"/>
    </linearGradient>
    <radialGradient id="bgTint" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f6f8"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f3a63" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="820" rx="140" ry="140" fill="url(#bgTint)"/>

  <g filter="url(#softShadow)" stroke-linecap="round" stroke-linejoin="round">

    <!-- overlapping rings: vision + voice -->
    <circle cx="470" cy="410" r="232" fill="none" stroke="url(#navy)" stroke-width="22"/>
    <circle cx="772" cy="410" r="232" fill="none" stroke="url(#navy)" stroke-width="22"/>

    <!-- CAMERA ICON, all-curved -->
    <g stroke="url(#navy)" stroke-width="22" fill="none">
      <!-- soft rounded viewfinder hump, no sharp corners -->
      <path d="M420 318 C420 288 438 270 470 270 C502 270 520 288 520 318"/>
      <!-- body, generous corner radius -->
      <rect x="350" y="318" width="240" height="176" rx="40"/>
      <!-- lens outer -->
      <circle cx="470" cy="406" r="64"/>
      <!-- lens inner -->
      <circle cx="470" cy="406" r="30"/>
      <!-- flash dot -->
      <circle cx="548" cy="344" r="9" fill="url(#navy)" stroke="none"/>
    </g>

    <!-- SPEECH BUBBLE WITH "A", curved tail -->
    <g>
      <path d="M687 330 H857 A32 32 0 0 1 889 362 V448 A32 32 0 0 1 857 480 H766
               C757 480 749 484 743 492
               L716 524 C711 530 702 526 703 519
               L706 480 H687
               A32 32 0 0 1 655 448 V362 A32 32 0 0 1 687 330 Z"
            fill="none" stroke="url(#navy)" stroke-width="22"/>
      <text x="770" y="407" font-family="'Arial Rounded MT Bold', 'SF Pro Rounded', Verdana, Arial, sans-serif"
            font-weight="700" font-size="88"
            text-anchor="middle" dominant-baseline="central" fill="url(#navy)">A</text>
    </g>

  </g>
</svg>
