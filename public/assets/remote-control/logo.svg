<svg width="1408" height="768" viewBox="0 0 1408 768" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0f1614"/>
      <stop offset="55%" stop-color="#0c1110"/>
      <stop offset="100%" stop-color="#090d0c"/>
    </radialGradient>

    <linearGradient id="phoneStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8CFFC7"/>
      <stop offset="45%" stop-color="#4CE996"/>
      <stop offset="100%" stop-color="#2FD17E"/>
    </linearGradient>

    <linearGradient id="screenFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1d17"/>
      <stop offset="100%" stop-color="#060f0c"/>
    </linearGradient>

    <linearGradient id="waveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fe38a" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8CFFC7"/>
      <stop offset="100%" stop-color="#3fe38a" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B9FFDD" stop-opacity="1"/>
      <stop offset="35%" stop-color="#5CF0A0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5CF0A0" stop-opacity="0"/>
    </radialGradient>

    <filter id="phoneShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dotGrid" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.035"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1408" height="768" fill="url(#bgGlow)"/>
  <rect width="1408" height="768" fill="url(#dotGrid)"/>

  <!-- concentric signal rings behind top glow -->
  <g opacity="0.5">
    <circle cx="704" cy="82" r="34" fill="none" stroke="#3fe38a" stroke-width="1.4" opacity="0.25"/>
    <circle cx="704" cy="82" r="52" fill="none" stroke="#3fe38a" stroke-width="1.1" opacity="0.15"/>
  </g>

  <!-- glow dot at top -->
  <circle cx="704" cy="82" r="24" fill="url(#dotGlow)"/>

  <!-- pulse / signal wave -->
  <g filter="url(#lineGlow)">
    <path d="M 592 150 L 648 150 L 668 108 L 690 178 L 710 68 L 730 152 L 750 128 L 772 150 L 816 150"
          fill="none" stroke="url(#waveStroke)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- connector from wave into phone notch -->
  <line x1="704" y1="150" x2="704" y2="190" stroke="#4CE996" stroke-width="5" stroke-linecap="round"/>

  <!-- PHONE BODY (enlarged, recentered) -->
  <g filter="url(#phoneShadow)">
    <rect x="572" y="190" width="264" height="492" rx="46"
          fill="url(#screenFill)" stroke="url(#phoneStroke)" stroke-width="8"/>
  </g>

  <!-- side buttons -->
  <rect x="563" y="270" width="7" height="34" rx="3.5" fill="#3fe38a"/>
  <rect x="563" y="314" width="7" height="52" rx="3.5" fill="#3fe38a"/>
  <rect x="838" y="292" width="7" height="62" rx="3.5" fill="#3fe38a"/>

  <!-- notch -->
  <path d="M 668 190 h 72 v 3 a 19 19 0 0 1 -19 19 h -34 a 19 19 0 0 1 -19 -19 z" fill="#08110d"/>
  <rect x="690" y="196" width="28" height="5" rx="2.5" fill="#0d1c16"/>

  <!-- screen inner area -->
  <rect x="592" y="244" width="224" height="392" rx="14" fill="#071310" opacity="0.9"/>

  <!-- hex data rows -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="21" fill="#3FE38A">
    <text x="606" y="342">0x01 0xFE 0x22</text>
    <text x="606" y="380">0x02 0x01 0x23</text>
    <text x="606" y="418">0x01 0x00 0x2F</text>
    <text x="606" y="456" opacity="0.55">0x0A 0x9C 0x10</text>
  </g>

  <!-- subtle scan line accent -->
  <rect x="592" y="500" width="224" height="1.5" fill="#3FE38A" opacity="0.25"/>

  <!-- home indicator -->
  <rect x="662" y="654" width="84" height="7" rx="3.5" fill="#0d1c16"/>
</svg>
