<section class="section" id="contact">
  <div class="contact-box">

    <p class="eyebrow">
      {{ i18n.t('contact.eyebrow') }}
    </p>

    <h2>
      {{ i18n.t('contact.title') }}
    </h2>

    <p class="description">
      {{ i18n.t('contact.description') }}
    </p>

    <div class="actions">

      <!-- Primary mailto link -->
      <a [href]="mailtoLink" class="btn primary large">
        {{ i18n.t('contact.email') }}
      </a>

      <!-- Fallback / Copy button right beside it -->
      <button (click)="copyEmail($event)" class="btn large">
        {{ copied ? 'Copied to clipboard!' : 'Copy Email' }}
      </button>

      <!-- Resume download -->
      <a [href]="resumePath" download class="btn large">
        {{ i18n.t('contact.resume') }}
      </a>

    </div>

    <!-- Always visible raw text option just in case -->
    <p class="email-fallback-text">
      Or reach out directly at: <code>{{ emailAddress }}</code>
    </p>

  </div>
</section>
