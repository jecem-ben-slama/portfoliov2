<section class="section" id="experience">

  <div class="section-head">

    <p class="eyebrow">
      {{ i18n.t('experience.eyebrow') }}
    </p>

    <h2>
      {{ i18n.t('experience.title') }}
    </h2>

  </div>

  <div class="timeline" *ngIf="experience.length; else empty">

    <div class="entry" *ngFor="let e of experience">

      <div class="entry-head">

        <h3>
          {{ i18n.t(e.role) }}
          ·
          {{ i18n.t(e.organization) }}
        </h3>

        <span class="date">
          {{ i18n.t(e.dateRange) }}
        </span>

      </div>

      <ul>

        <li *ngFor="let b of e.bullets">
          {{ i18n.t(b) }}
        </li>

      </ul>

      <div class="tags" *ngIf="e.tags?.length">

        <span class="tag" *ngFor="let t of e.tags">
          {{ t }}
        </span>

      </div>

    </div>

  </div>

  <ng-template #empty>

    <p class="empty-note">
      {{ i18n.t('experience.empty') }}
    </p>

  </ng-template>

</section>
