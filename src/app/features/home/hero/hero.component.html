<section class="hero">

  <p class="eyebrow">
    {{ i18n.t('hero.eyebrow') }}
  </p>

  <h1>
    {{ i18n.t('hero.title') }}
  </h1>

  <p class="value-prop">
    {{ i18n.t('hero.description') }}
  </p>

  <div class="socials">

    <a href="https://github.com/jecem-ben-slama" target="_blank" rel="noopener noreferrer" class="btn">
      GitHub
    </a>

    <a href="https://www.linkedin.com/in/jecem-ben-slama/" target="_blank" rel="noopener noreferrer" class="btn">
      LinkedIn
    </a>

    <!-- Updated to use the shared service click handler -->
    <button type="button" (click)="onContactClick($event)" class="btn primary">
      {{ i18n.t('hero.contactMe') }}
    </button>

  </div>

</section>
