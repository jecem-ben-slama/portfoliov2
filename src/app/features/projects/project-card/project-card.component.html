<a class="card" [routerLink]="['/projects', project.slug]">
  <span class="featured-badge" *ngIf="project.featured">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.5L22 9.3l-5 4.9 1.2 7.1L12 17.9l-6.2 3.4L7 14.2 2 9.3l7.1-.8L12 2z"/></svg>
    Featured
  </span>

  <img
    *ngIf="project.image; else placeholder"
    class="card-img"
    [src]="project.image"
    [alt]="project.name + ' screenshot'"
    loading="lazy"
  />
  <ng-template #placeholder>
    <div class="img-placeholder">image: set project.image</div>
  </ng-template>

  <span class="status" [class.active]="project.status === 'shipped'"
        [class.progress]="project.status === 'in-progress'"
        [class.draft]="project.status === 'draft'">
    <span class="status-dot"></span>{{ project.status }}
  </span>

  <h2>{{ project.name }}</h2>
  <p class="tagline">{{ project.tagline }}</p>
  <p class="desc">{{ project.description }}</p>

  <div class="tags">
    <span class="tag" *ngFor="let t of project.tags">{{ t }}</span>
  </div>

  <div class="card-foot">
    <span class="read-more">Read the breakdown &rarr;</span>
  </div>
</a>
